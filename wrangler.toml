
name = "telegram-bot2"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[kv_namespaces]]
binding = "BOT_KV"
id = "f72885df92e94d4196d9bb2b39eb5472"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/telegram/*", "/pay/*", "/internal/*", "/service-pay/*", "/sub/*", "/sub-all/*", "/bots/*", "/cr-hook/*", "/cr-relay/*"]

[vars]
APP_VERSION = "3.6.0"


[[durable_objects.bindings]]
name = "BOT_STATE"
class_name = "BotCoordinator"

[[migrations]]
tag = "v2-durable-state"
new_sqlite_classes = ["BotCoordinator"]

[triggers]
crons = ["* * * * *"]

# Optional encrypted nightly service backups. Create the bucket before enabling:
# [[r2_buckets]]
# binding = "BACKUPS"
# bucket_name = "botpanel-service-backups"
